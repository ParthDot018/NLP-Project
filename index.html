<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div class="max-w-4xl mx-auto p-6">
        <!-- Header -->
        <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">Smart Study Assistant</h1>

        <!-- 1. File Upload Section -->
        <div id="upload-section" class="bg-white p-8 rounded-lg shadow-sm border-2 border-dashed border-blue-400 text-center cursor-pointer hover:bg-blue-50 transition">
            <input type="file" id="file-upload" accept=".pptx" class="hidden" />
            <label for="file-upload" class="cursor-pointer w-full h-full block">
                <svg class="mx-auto h-12 w-12 text-blue-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <p class="text-lg text-gray-600 font-medium">Click to upload your PPTX file</p>
                <p class="text-sm text-gray-400 mt-2">Maximum file size: 50MB</p>
            </label>
            <div id="upload-status" class="mt-4 text-sm font-semibold text-blue-600 hidden">Processing presentation...</div>
        </div>

        <!-- 2. Topics Display Section (Hidden until upload completes) -->
        <div id="topics-section" class="mt-12 hidden">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">Presentation Topics</h2>
            <div id="topics-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Topic cards injected here by JavaScript -->
            </div>
        </div>

        <!-- 3. Q&A Section (Hidden until a topic is clicked) -->
        <div id="qa-section" class="mt-8 bg-white p-6 rounded-lg shadow-md hidden border border-gray-200">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 id="qa-topic-title" class="text-xl font-bold text-blue-600">Topic Name</h3>
                    <span id="qa-topic-pages" class="bg-blue-100 text-blue-800 text-xs font-semibold px-2 py-1 rounded mt-2 inline-block">Slides: </span>
                </div>
                <button id="close-qa" class="text-gray-400 hover:text-red-500 font-bold text-xl">&times;</button>
            </div>
            
            <div class="bg-gray-100 p-4 rounded mb-6">
                <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Quick Summary</h4>
                <p id="qa-topic-summary" class="text-gray-700 text-sm">Summary text...</p>
            </div>
            
            <!-- Ask Question Input -->
            <div class="flex gap-2">
                <input type="text" id="question-input" placeholder="Ask a question specific to this topic..." class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                <button id="ask-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition font-medium">Ask</button>
            </div>

            <!-- Answer Display Box -->
            <div id="answer-box" class="mt-6 hidden">
                <h4 class="font-semibold text-gray-700 mb-2">Answer from Slides:</h4>
                <p id="answer-text" class="text-gray-800 bg-green-50 p-4 rounded-lg border border-green-200 leading-relaxed"></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
