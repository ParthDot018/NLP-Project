<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased selection:bg-indigo-100 selection:text-indigo-900">
    <div class="max-w-5xl mx-auto p-6 lg:p-8">
        
        <header class="text-center mb-12 mt-6">
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-linear-to-r from-indigo-600 to-blue-500 tracking-tight mb-3">Smart Study Assistant</h1>
            <p class="text-slate-500 font-medium text-lg">Upload your lecture slides to instantly extract topics and find answers.</p>
        </header>

        <div id="upload-section" class="bg-white p-10 rounded-2xl shadow-sm border-2 border-dashed border-indigo-200 text-center cursor-pointer hover:border-indigo-400 hover:bg-indigo-50/50 hover:shadow-md transition-all duration-300 group">
            <input type="file" id="file-upload" accept=".pptx,.pdf" class="hidden" />
            <label for="file-upload" class="cursor-pointer w-full h-full block">
                <div class="bg-indigo-50 w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-300">
                    <svg class="h-8 w-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                </div>
                <p class="text-xl text-slate-700 font-semibold mb-1">Click to upload your presentation</p>
                <p class="text-sm text-slate-400 font-medium">Supports .PPTX and .PDF up to 50MB</p>
            </label>
            <div id="upload-status" class="mt-6 text-sm font-bold text-indigo-600 hidden animate-pulse">Analyzing presentation data...</div>
        </div>

        <div id="topics-section" class="mt-16 hidden">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Extracted Topics</h2>
                <span class="text-sm font-semibold text-slate-500 bg-slate-200 px-3 py-1 rounded-full" id="topic-count">0 found</span>
            </div>
            <div id="topics-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            </div>
        </div>

        <div id="qa-section" class="mt-12 bg-white rounded-2xl shadow-xl border border-slate-200 hidden overflow-hidden transition-all">
            
            <div class="bg-slate-50 border-b border-slate-100 px-6 py-5 flex justify-between items-start">
                <div>
                    <div class="flex items-center gap-3 mb-1">
                        <h3 id="qa-topic-title" class="text-xl font-bold text-slate-800">Topic Name</h3>
                        <span id="qa-topic-pages" class="bg-indigo-100 text-indigo-700 ring-1 ring-indigo-600/20 text-xs font-bold px-2.5 py-0.5 rounded-full">Slides: </span>
                    </div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-4 mb-1">Quick Summary</p>
                    <p id="qa-topic-summary" class="text-slate-600 text-sm leading-relaxed">Summary text...</p>
                </div>
                <button id="close-qa" class="text-slate-400 hover:text-red-500 hover:bg-red-50 p-2.5 rounded-full transition-colors flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-6">
                <div class="flex gap-3">
                    <input type="text" id="question-input" placeholder="Ask anything about this specific topic..." class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all shadow-sm">
                    <button id="ask-btn" class="bg-gradient-to-r-from-indigo-600 to-blue-600 text-white font-semibold px-6 py-3 rounded-xl hover:shadow-lg hover:opacity-90 transition-all active:scale-95">Ask</button>
                </div>

                <div id="answer-box" class="mt-6 hidden">
                    <div class="bg-emerald-50 border border-emerald-100 p-5 rounded-xl">
                        <div>
                            <h4 class="font-bold text-emerald-800 mb-1 text-sm uppercase tracking-wide">Extracted Answer</h4>
                            <p id="answer-text" class="text-emerald-900 leading-relaxed font-medium"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
